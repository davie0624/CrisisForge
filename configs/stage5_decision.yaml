experiment:
  id: stage5_validation_portfolio_decisions_v1
  evaluation_split: validation
  radius_grid_role: exploratory_validation_only

forecast:
  horizon: 20
  origin_stride: 20
  historical_lookback_observations: 1500
  minimum_historical_scenarios: 1000

paths:
  model_matrix: data/processed/model_matrix.parquet
  phase0_manifest: artifacts/phase0/manifest.json
  portfolio_model_config: configs/portfolio.yaml
  stage1_scenario_archive: artifacts/stage1_switching_factor/cumulative_scenarios.npz
  stage1_run_receipt: artifacts/stage1_switching_factor/run_receipt.json
  output: artifacts/stage5_decisions

claims_boundary:
  test_set_opened: false
  select_final_radius: false
  note: >-
    Every Wasserstein radius is reported as a separate validation-only
    sensitivity strategy. No radius is selected or described as final until a
    separately preregistered test-stage protocol is authorized.
