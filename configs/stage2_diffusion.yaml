stage: 2
model_name: one_shot_regime_conditioned_factor_ddpm
estimator_scope: multi-stage neural scenario-generator baseline

data:
  factor_transform: stage1_train_fold_only
  forecast_horizon: 20
  history_length: 120
  context_policy: past_and_forecast_origin_only
  known_future_context: forbidden
  regime_input: filtered_soft_probabilities_at_origin

diffusion:
  architecture: conditioned_temporal_residual_network
  generation_mode: one_shot_horizon_by_factor_tensor
  autoregressive_horizon_loop: false
  factor_dim: 4
  context_dim: 14
  regime_dim: 4
  diffusion_steps: 100
  beta_schedule: linear
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  hidden_channels: 64
  time_embedding_dim: 64
  residual_blocks: 4

training:
  random_seed: 1729
  optimizer: adamw
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  batch_size: 64
  gradient_clip_norm: 1.0
  early_stopping_metric: validation_energy_score
  checkpoint_selection: validation_only
  test_split_access: sealed

tail_fine_tuning:
  enabled_after_base_convergence: true
  severity_direction: two_sided
  severity_quantile: 0.90
  importance_strength: 3.0
  maximum_weight: 8.0
  normalize_weights_to_mean_one: true
  training_fold_only: true

pot_gpd:
  loss_input: volatility_standardized_portfolio_loss
  threshold_quantiles_for_diagnostics: [0.90, 0.925, 0.95, 0.975]
  selected_threshold_quantile: 0.95
  minimum_exceedances: 25
  sparse_tail_policy: refuse_or_empirical_fallback

conformal:
  target: upper_loss_quantile_var
  coverage_level: 0.95
  rolling_window: 250
  minimum_history: 20
  update_rule: after_realized_outcome_arrives
  expected_shortfall_guarantee: false

required_ablations:
  - unconditional_factor_diffusion
  - hard_regime_conditioning_negative_control
  - soft_regime_conditioning
  - base_training_without_tail_weights
  - tail_weighted_fine_tuning

claims_boundary:
  direct_asset_return_generator: false
  full_bayesian_posterior: false
  causal_intervention: false
  guaranteed_tail_superiority: false
  note: >
    This stage generates complete latent-factor paths conditional on information
    available at forecast issuance. Asset-level risk requires the separately
    fitted state-dependent observation mapping and held-out evaluation.
