experiment:
  id: cvar_wasserstein_decision_v1
  random_seed: 20260728

portfolio:
  confidence_level: 0.95
  fully_invested: true
  long_only: true
  lower_position_limit: 0.0
  upper_position_limit: 0.20

trading:
  # L1 turnover is sum(abs(w_new - w_previous)); it is not divided by two.
  turnover_definition: l1
  maximum_l1_turnover: 0.40
  proportional_transaction_cost: 0.001

distributional_robustness:
  ambiguity_set: one_wasserstein_ball
  ground_transport_norm: l1
  dual_portfolio_norm: linfinity
  # Radius is in decimal-return units. In the sealed-test public experiment,
  # every positive value is reported as a separate validation sensitivity; no
  # final radius is selected.
  candidate_radii: [0.0, 0.0001, 0.00025, 0.0005, 0.001]
  strong_dual_penalty: "rho * ||w||_infinity / (1 - alpha)"
  support_assumption: unbounded_return_space

solver:
  backend: scipy_linprog_highs
  retain_diagnostics: true
